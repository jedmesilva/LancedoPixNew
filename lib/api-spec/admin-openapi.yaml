openapi: 3.1.0
info:
  title: Lance do Pix Admin API
  version: 1.0.0
  description: API privada e isolada para operações administrativas do Lance do Pix.
servers:
  - url: /api/admin
    description: Base da API administrativa
tags:
  - name: auth
    description: Acesso privado do painel
  - name: dashboard
    description: Resumo operacional
  - name: disputes
    description: Busca e histórico de disputas
  - name: payouts
    description: Fila de resgates
  - name: treasury
    description: Posição de caixa
  - name: automation
    description: Configuração, aportes e histórico do bot identificado
paths:
  /auth/session:
    get:
      operationId: getAdminSession
      tags: [auth]
      summary: Consultar sessão administrativa
      responses:
        "200":
          description: Estado da sessão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    post:
      operationId: createAdminSession
      tags: [auth]
      summary: Entrar com a chave administrativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Sessão iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Chave inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Chave administrativa ainda não configurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: endAdminSession
      tags: [auth]
      summary: Encerrar sessão administrativa
      responses:
        "200":
          description: Sessão encerrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /dashboard:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Obter resumo das disputas, espectadores, caixa e resgates
      responses:
        "200":
          description: Resumo operacional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /disputes:
    get:
      operationId: listAdminDisputes
      tags: [disputes]
      summary: Pesquisar disputas e consultar histórico
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: Página de disputas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDisputePage"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /disputes/{id}:
    get:
      operationId: getAdminDispute
      tags: [disputes]
      summary: Consultar uma disputa e seus lances
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Detalhes da disputa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDisputeDetail"
        "404":
          description: Disputa não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /disputes/{id}/close:
    post:
      operationId: closeAdminDispute
      tags: [disputes]
      summary: Encerrar disputa manualmente e estornar todos os lances
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDisputeCloseInput"
      responses:
        "200":
          description: Disputa encerrada e créditos devolvidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDisputeCloseResult"
        "400":
          description: Motivo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Disputa não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Disputa não está em andamento ou pausada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /payouts:
    get:
      operationId: listAdminPayouts
      tags: [payouts]
      summary: Consultar a fila e o status dos resgates
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [requested, under_review, paid, rejected]
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: Página de resgates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayoutPage"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /payouts/{id}:
    patch:
      operationId: updateAdminPayout
      tags: [payouts]
      summary: Atualizar o estado de um resgate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPayoutUpdateInput"
      responses:
        "200":
          description: Estado atualizado e auditado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPayoutUpdateResult"
        "400":
          description: Transição ou dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Resgate não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Transição conflitante ou referência Pix duplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /treasury:
    get:
      operationId: getAdminTreasury
      tags: [treasury]
      summary: Consultar posição de caixa não simulada
      responses:
        "200":
          description: Posição de caixa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreasurySnapshot"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /treasury/movements:
    get:
      operationId: listAdminTreasuryMovements
      tags: [treasury]
      summary: Consultar movimentações reais do caixa
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: Movimentações não simuladas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTreasuryMovementPage"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /treasury/contributions:
    post:
      operationId: recordAdminTreasuryContribution
      tags: [treasury]
      summary: Registrar um aporte de capital já recebido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTreasuryContributionInput"
      responses:
        "201":
          description: Aporte registrado no livro-caixa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTreasuryContributionResult"
        "400":
          description: Valor ou confirmação inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Referência já registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /automation/accounts:
    get:
      operationId: listAutomationAccounts
      tags: [automation]
      summary: Listar contas disponíveis para a automação
      responses:
        "200":
          description: Contas com carteira disponíveis para seleção
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationAccountList"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /automation/config:
    get:
      operationId: getAutomationConfig
      tags: [automation]
      summary: Consultar regras e estado do bot
      responses:
        "200":
          description: Configuração operacional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationConfig"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: updateAutomationConfig
      tags: [automation]
      summary: Atualizar limites ou ligar e desligar o bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationConfigInput"
      responses:
        "200":
          description: Configuração salva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationConfig"
        "400":
          description: Configuração inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Bot sem fundos ou limites suficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /automation/funding:
    post:
      operationId: recordAutomationFunding
      tags: [automation]
      summary: Registrar aporte real confirmado para a carteira do bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationFundingInput"
      responses:
        "201":
          description: Aporte registrado e auditado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationFundingResult"
        "400":
          description: Aporte ou confirmação inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Referência de aporte já utilizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /automation/events:
    get:
      operationId: listAutomationEvents
      tags: [automation]
      summary: Consultar histórico de lances e alterações do bot
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: Eventos da automação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationEventPage"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ApiError:
      type: object
      properties:
        error: { type: string }
      required: [error]
    OkResponse:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    AdminLoginInput:
      type: object
      properties:
        key: { type: string, minLength: 1, maxLength: 512 }
      required: [key]
    AdminSession:
      type: object
      properties:
        authenticated: { type: boolean }
      required: [authenticated]
    AdminDisputeSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        status: { type: string, enum: [scheduled, live, paused, ended] }
        prizeCents: { type: integer }
        currentValueCents: { type: ["integer", "null"] }
        stepCents: { type: integer }
        bidsCount: { type: integer }
        startedAt: { type: ["string", "null"], format: date-time }
        timerDeadlineAt: { type: ["string", "null"], format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        leaderName: { type: ["string", "null"] }
        winnerName: { type: ["string", "null"] }
        automationBidCount: { type: integer, minimum: 0 }
        automationBotLeading: { type: boolean }
        automationBotWon: { type: boolean }
      required:
        - id
        - number
        - status
        - prizeCents
        - currentValueCents
        - stepCents
        - bidsCount
        - startedAt
        - timerDeadlineAt
        - endedAt
        - createdAt
        - leaderName
        - winnerName
        - automationBidCount
        - automationBotLeading
        - automationBotWon
    TreasurySnapshot:
      type: object
      properties:
        settledCashCents: { type: integer }
        cashOutflowsCents: { type: integer }
        lockedWalletCents: { type: integer }
        unpaidPrizeCents: { type: integer }
        reservedBonusCents: { type: integer }
        freeCashCents: { type: integer }
        includesSimulated: { type: boolean, const: false }
      required:
        - settledCashCents
        - cashOutflowsCents
        - lockedWalletCents
        - unpaidPrizeCents
        - reservedBonusCents
        - freeCashCents
        - includesSimulated
    AdminDashboard:
      type: object
      properties:
        currentDispute:
          anyOf:
            - $ref: "#/components/schemas/AdminDisputeSummary"
            - type: "null"
        activeConnections: { type: integer }
        totalVisitors: { type: integer }
        visitorsToday: { type: integer }
        pendingPayoutCount: { type: integer }
        pendingPayoutAmountCents: { type: integer }
        paidPayoutCount: { type: integer }
        paidPayoutAmountCents: { type: integer }
        liveDisputes:
          type: array
          items: { $ref: "#/components/schemas/AdminDisputeSummary" }
        historyDisputeCount: { type: integer }
        historyBidCount: { type: integer }
        platformRevenueCents: { type: integer }
        prizeCoverageCents: { type: integer }
        treasury: { $ref: "#/components/schemas/TreasurySnapshot" }
        recentDisputes:
          type: array
          items: { $ref: "#/components/schemas/AdminDisputeSummary" }
      required:
        - currentDispute
        - activeConnections
        - totalVisitors
        - visitorsToday
        - pendingPayoutCount
        - pendingPayoutAmountCents
        - paidPayoutCount
        - paidPayoutAmountCents
        - liveDisputes
        - historyDisputeCount
        - historyBidCount
        - platformRevenueCents
        - prizeCoverageCents
        - treasury
        - recentDisputes
    AdminDisputePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminDisputeSummary" }
        total: { type: integer }
      required: [items, total]
    AdminDisputeCloseInput:
      type: object
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
      required: [reason]
    AdminDisputeCloseResult:
      type: object
      properties:
        disputeId: { type: string, format: uuid }
        status: { type: string, enum: [ended] }
        refundedBidCount: { type: integer, minimum: 0 }
        refundedCreditsCents: { type: integer, minimum: 0 }
        endedAt: { type: string, format: date-time }
      required:
        - disputeId
        - status
        - refundedBidCount
        - refundedCreditsCents
        - endedAt
    AdminDisputeBid:
      type: object
      properties:
        id: { type: string, format: uuid }
        amountCents: { type: integer }
        costCents: { type: integer }
        bidderName: { type: string }
        automated: { type: boolean }
        createdAt: { type: string, format: date-time }
        result: { type: ["string", "null"], enum: [won, lost, null] }
      required: [id, amountCents, costCents, bidderName, automated, createdAt, result]
    AdminDisputeDetail:
      type: object
      properties:
        dispute: { $ref: "#/components/schemas/AdminDisputeSummary" }
        bids:
          type: array
          items: { $ref: "#/components/schemas/AdminDisputeBid" }
        manualClosure:
          oneOf:
            - $ref: "#/components/schemas/AdminDisputeManualClosure"
            - type: "null"
      required: [dispute, bids, manualClosure]
    AdminDisputeManualClosure:
      type: object
      properties:
        reason: { type: string }
        actorId: { type: string }
        refundedBidCount: { type: integer, minimum: 0 }
        refundedCreditsCents: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
      required:
        - reason
        - actorId
        - refundedBidCount
        - refundedCreditsCents
        - createdAt
    AdminPayout:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested, under_review, paid, rejected] }
        amountCents: { type: integer }
        prizeCents: { type: integer }
        bonusCents: { type: integer }
        userName: { type: string }
        pixKeyType: { type: string, enum: [cpf, email, phone, random] }
        requestedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - status
        - amountCents
        - prizeCents
        - bonusCents
        - userName
        - pixKeyType
        - requestedAt
        - updatedAt
    AdminPayoutPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminPayout" }
        total: { type: integer }
      required: [items, total]
    AdminPayoutUpdateInput:
      type: object
      properties:
        status: { type: string, enum: [requested, under_review, paid, rejected] }
        pixE2eId: { type: string, minLength: 3, maxLength: 128 }
        reason: { type: string, minLength: 3, maxLength: 240 }
      required: [status]
    AdminPayoutUpdateResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested, under_review, paid, rejected] }
        updatedAt: { type: string, format: date-time }
      required: [id, status, updatedAt]
    AdminTreasuryMovement:
      type: object
      properties:
        id: { type: string }
        category: { type: string, enum: [topup, contribution, payout, refund, fee, ad_revenue] }
        entryType: { type: string }
        amountCents: { type: integer }
        userName: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        reference: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        runningBalanceCents: { type: integer }
      required: [id, category, entryType, amountCents, userName, note, reference, createdAt, runningBalanceCents]
    AdminTreasuryMovementPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminTreasuryMovement" }
        total: { type: integer }
      required: [items, total]
    AdminTreasuryContributionInput:
      type: object
      properties:
        amountCents: { type: integer, minimum: 1, maximum: 100000000 }
        receiptReference: { type: string, minLength: 3, maxLength: 120 }
        note: { type: string, maxLength: 60 }
        cashReceived: { type: boolean, const: true }
      required: [amountCents, receiptReference, cashReceived]
    AdminTreasuryContributionResult:
      type: object
      properties:
        amountCents: { type: integer }
        receiptReference: { type: string }
        createdAt: { type: string, format: date-time }
      required: [amountCents, receiptReference, createdAt]
    AutomationConfig:
      type: object
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [counterbids_only, bids_and_counterbids, bids_only] }
        bidTriggerMode: { type: string, enum: [on_outbid, at_fixed_time] }
        botUserId: { type: ["string", "null"], format: uuid }
        botExists: { type: boolean }
        botName: { type: string }
        botWalletBalanceCents: { type: integer }
        maxBidCents: { type: integer }
        perDisputeLimitCents: { type: integer }
        dailyLimitCents: { type: integer }
        maxBidsPerDispute: { type: integer }
        minimumSecondsRemaining: { type: integer }
        minimumDelaySeconds: { type: integer }
        canEnable: { type: boolean }
        blockedReasons:
          type: array
          items: { type: string }
        operatorRules: { $ref: "#/components/schemas/AutomationOperatorRules" }
        updatedAt: { type: ["string", "null"], format: date-time }
      required:
        - enabled
        - mode
        - bidTriggerMode
        - botUserId
        - botExists
        - botName
        - botWalletBalanceCents
        - maxBidCents
        - perDisputeLimitCents
        - dailyLimitCents
        - maxBidsPerDispute
        - minimumSecondsRemaining
        - minimumDelaySeconds
        - canEnable
        - blockedReasons
        - operatorRules
        - updatedAt
    AutomationConfigInput:
      type: object
      properties:
        enabled: { type: boolean }
        mode: { type: string, enum: [counterbids_only, bids_and_counterbids, bids_only] }
        bidTriggerMode: { type: string, enum: [on_outbid, at_fixed_time] }
        botUserId: { type: ["string", "null"], format: uuid }
        maxBidCents: { type: integer, minimum: 0, maximum: 100000000 }
        perDisputeLimitCents: { type: integer, minimum: 0, maximum: 100000000 }
        dailyLimitCents: { type: integer, minimum: 0, maximum: 100000000 }
        maxBidsPerDispute: { type: integer, minimum: 0, maximum: 10000 }
        minimumSecondsRemaining: { type: integer, minimum: 1, maximum: 60 }
        minimumDelaySeconds: { type: integer, minimum: 1, maximum: 3600 }
        operatorRules: { $ref: "#/components/schemas/AutomationOperatorRules" }
      required:
        - enabled
        - mode
        - bidTriggerMode
        - botUserId
        - maxBidCents
        - perDisputeLimitCents
        - dailyLimitCents
        - maxBidsPerDispute
        - minimumSecondsRemaining
        - minimumDelaySeconds
        - operatorRules
    AutomationOperatorRules:
      type: object
      properties:
        status: { type: string, enum: [ativa, pausada, desativada] }
        opening:
          type: object
          properties:
            on: { type: boolean }
            trigger: { type: string, enum: [immediate, final] }
            seconds: { type: integer, minimum: 0, maximum: 60 }
            multiplier: { type: integer, minimum: 1, maximum: 1000 }
          required: [on, trigger, seconds, multiplier]
        counter:
          type: object
          properties:
            on: { type: boolean }
            trigger: { type: string, enum: [immediate, final] }
            seconds: { type: integer, minimum: 0, maximum: 60 }
            multiplier: { type: integer, minimum: 1, maximum: 1000 }
          required: [on, trigger, seconds, multiplier]
