openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: API de contas, carteira e disputas do Lance do Pix
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Estado do servidor
  - name: auth
    description: Contas e sessões
  - name: lance
    description: Disputas, lances e carteira
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Verificar disponibilidade da API
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Consultar a sessão atual
      responses:
        "200":
          description: Conta autenticada ou sessão anônima
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Criar conta com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 128 }
              required: [name, email, password]
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Entrar com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 128 }
              required: [email, password]
      responses:
        "200":
          description: Sessão iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Encerrar a sessão atual
      responses:
        "200":
          description: Sessão encerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
  /auth/google-test:
    post:
      operationId: createGoogleTestAccount
      tags: [auth]
      summary: Criar uma conta persistente de teste no lugar do OAuth do Google
      responses:
        "201":
          description: Conta de teste criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Atualizar o nome da conta atual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
              required: [name]
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Alterar a senha da conta atual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 128 }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
              required: [currentPassword, newPassword]
      responses:
        "200":
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Senha atual inválida ou autenticação necessária
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /lance/state:
    get:
      operationId: getLanceState
      tags: [lance]
      summary: Consultar disputa, carteira e lances persistidos
      responses:
        "200":
          description: Estado atual da disputa e da conta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceState"
  /lance/actions:
    post:
      operationId: postLanceAction
      tags: [lance]
      summary: Registrar um lance, uma recarga simulada ou um pedido de resgate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanceAction"
      responses:
        "200":
          description: Resultado da ação e novo estado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanceActionResponse"
        "400":
          description: Ação inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    ApiError:
      type: object
      properties:
        error: { type: string }
      required: [error]
    Prize:
      type: object
      properties:
        v: { type: number }
        b: { type: number }
      required: [v, b]
    HistoryEntry:
      type: object
      properties:
        n: { type: integer }
        v: { type: number }
        t: { type: integer }
      required: [n, v, t]
    User:
      type: object
      properties:
        id: { type: [string, "null"], format: uuid }
        name: { type: string }
        email: { type: string }
        signedIn: { type: boolean }
        testAccount: { type: boolean }
      required: [id, name, email, signedIn, testAccount]
    AuthSession:
      type: object
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
      required: [user]
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        amt: { type: number }
        state: { type: string, enum: [pending, paid, expired, failed] }
        left: { type: integer }
        expiresAt: { type: integer }
        credited: { type: boolean }
        seed: { type: integer }
        code: { type: string }
      required: [id, amt, state, left, expiresAt, credited, seed, code]
    Wallet:
      type: object
      properties:
        bal: { type: number }
        pay:
          anyOf:
            - $ref: "#/components/schemas/Payment"
            - type: "null"
      required: [bal, pay]
    Auction:
      type: object
      properties:
        round: { type: integer }
        p: { type: integer }
        phase: { type: string, enum: [live, paused, ended, soon] }
        value: { type: number }
        leader: { type: integer }
        left: { type: integer }
        soon: { type: integer }
        targetAt: { type: [integer, "null"] }
        bonusSecs: { type: integer }
        notify: { type: boolean }
        H:
          type: array
          items: { $ref: "#/components/schemas/HistoryEntry" }
        paid: { type: boolean }
        minimumBid: { type: number }
        bonus: { type: [number, "null"] }
      required: [round, p, phase, value, leader, left, soon, targetAt, bonusSecs, notify, H, paid, minimumBid, bonus]
    Bid:
      type: object
      properties:
        id: { type: string, format: uuid }
        round: { type: integer }
        value: { type: number }
        at: { type: integer }
        prize: { type: number }
        bonus: { type: number }
        res: { type: [string, "null"], enum: [won, lost, null] }
        redeemed: { type: boolean }
        status: { type: string, enum: [won, leading, outbid] }
      required: [id, round, value, at, prize, bonus, res, redeemed, status]
    LanceState:
      type: object
      properties:
        serverTime: { type: integer }
        cfg:
          type: object
          properties:
            V:
              type: array
              items: { $ref: "#/components/schemas/Prize" }
            N:
              type: array
              items: { type: string }
            TOTAL: { type: integer }
            START: { type: integer }
            STEP: { type: number }
          required: [V, N, TOTAL, START, STEP]
        auction: { $ref: "#/components/schemas/Auction" }
        wallet: { $ref: "#/components/schemas/Wallet" }
        user: { $ref: "#/components/schemas/User" }
        bids:
          type: array
          items: { $ref: "#/components/schemas/Bid" }
        redeemable: { type: integer }
        controlsEnabled: { type: boolean }
      required: [serverTime, cfg, auction, wallet, user, bids, redeemable, controlsEnabled]
    LanceAction:
      type: object
      properties:
        action:
          type: string
          enum: [bid, createPix, discardPix, setPixState, redeem, updateName]
        amount: { type: number }
        bidId: { type: string, format: uuid }
        paymentState: { type: string, enum: [pending, paid, expired, failed] }
        name: { type: string, minLength: 2, maxLength: 80 }
        pixKey: { type: string, minLength: 1, maxLength: 254 }
        keyType: { type: string, enum: [cpf, email, phone, random] }
        holderName: { type: string, minLength: 5, maxLength: 120 }
        cpf: { type: string, minLength: 11, maxLength: 14 }
      required: [action]
    LanceActionResponse:
      type: object
      properties:
        result: { type: string, enum: [ok, funds, invalid, exists, creds, not-found] }
        state: { $ref: "#/components/schemas/LanceState" }
      required: [result, state]
